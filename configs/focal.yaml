# Strategy B. Focal loss with gamma 1 and alpha null.
# Training budget matches runs/baseline, not the later 30-epoch run or the unsaved
# epochs: 50 / batch_size: 256 edit in configs/baseline.yaml.

seed: 42
run_name: focal
variant: vitb14
weights: weights/dinov2_vitb14_pretrain.pth
image_size: 224

data_root: /home/lheax/data/ISIC2018_Task3
train_image_dir: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Training_Input
train_csv: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Training_GroundTruth/ISIC2018_Task3_Training_GroundTruth.csv
val_image_dir: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Validation_Input
val_csv: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Validation_GroundTruth/ISIC2018_Task3_Validation_GroundTruth.csv
test_image_dir: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Test_Input
test_csv: /home/lheax/data/ISIC2018_Task3/ISIC2018_Task3_Test_GroundTruth/ISIC2018_Task3_Test_GroundTruth.csv

epochs: 20
batch_size: 256
num_workers: 8
lr_backbone: 1.0e-5
lr_head: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1
amp: true

loss:
  name: focal
  gamma: 1.0
  alpha: null

output_dir: outputs/focal
resume: ""
device: cuda
