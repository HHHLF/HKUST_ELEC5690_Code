seed: 42
device: cuda

data:
  root: /home/lheax/data/atriaseg2018
  train_dirname: Training Set
  test_dirname: Testing Set
  image_name: lgemri.nrrd
  label_name: laendo.nrrd
  val_ratio: 0.2
  split_seed: 42
  # Prepared once from the NRRD files. /dev/shm is memory and is cleared on reboot.
  cache_dir: /dev/shm/elec5690_la_seg3d
  cache_workers: 8
  # patch_size is [D, H, W] = [X, Y, Z]. Z is the 88-slice axis.
  patch_size: [112, 112, 80]
  fg_sample_prob: 0.5
  # Jitter keeps the sampled foreground voxel near the patch center while
  # avoiding a train/test gap where the atrium is always exactly centered.
  fg_center_jitter: [16, 16, 8]
  patches_per_case_per_epoch: 8

augment:
  flip_prob: 0.5
  rot90_prob: 0.5
  intensity_prob: 0.5
  noise_std: 0.05
  scale_min: 0.9
  scale_max: 1.1

model:
  in_channels: 1
  out_channels: 2
  # Five resolutions and four downsamplings. 16 is the base width.
  channels: [16, 32, 64, 128, 256]
  # InstanceNorm3d because the batch has 2 patches. GroupNorm is the other option.
  norm: instance

loss:
  ce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0

train:
  epochs: 300
  batch_size: 16
  grad_accum_steps: 1
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  eta_min: 0.000001
  amp: true
  grad_clip: 1.0
  val_interval: 10
  early_stopping_patience: 50
  # Kept at 0. A thread prefetches batches instead of forking DataLoader workers after CUDA starts.
  num_workers: 0

infer:
  overlap: 0.5
  sw_batch_size: 16
  gaussian_sigma_scale: 0.125
  postprocess: none

output:
  dir: outputs/segmentation3d
